# CI tool pins, by HASH (#301).
#
# These were three version strings and nothing else: no checksum, no test, nothing
# that noticed a bump. "A version string with no hash and no test guarding it is a
# comment." The workflow argued hashes would need a lockfile to pin honestly — that
# was right, and this is the lockfile.
#
# `ruff` and `uv` declare no dependencies at all, so either could have been hashed
# on its own. `skills-ref` pulls click>=8.0 and strictyaml>=1.7.3 on open ranges,
# which is what actually needed resolving; the transitive rows below are that.
#
# `uv` itself is gone rather than pinned: it existed only to run
# `uvx --from skills-ref agentskills`, and installing that from here calls the same
# console script with one fewer unpinned resolver in the path. An installed tool
# nothing invokes is the orphan-mechanism shape this catalog refuses (#284).
#
# Regenerate (never hand-edit a hash):
#   printf 'ruff==<v>\nskills-ref==<v>\n' > ci.in
#   uv pip compile --generate-hashes --python-version 3.13 --no-header -o \
#     .github/ci-tools.lock ci.in
#
# Proven both ways before landing, against the pinned versions on linux x86_64:
# the lock installs and both console scripts run; a lock with skills-ref's own
# hashes replaced is REFUSED by pip. (Replaced, not appended — pip treats multiple
# --hash lines for one package as alternatives, so an added bad hash proves
# nothing. That was my first control and it was wrong.)
