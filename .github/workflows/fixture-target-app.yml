# Slice S0 skeleton: pytest + ruff jobs. S4 owns smoke/CI wiring.
name: fixture-target-app

on:
  push:
    paths:
      - "demo/target-app/**"
      - ".github/workflows/fixture-target-app.yml"
  pull_request:
    paths:
      - "demo/target-app/**"
      - ".github/workflows/fixture-target-app.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/target-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (same pin as validate.yml)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv run pytest

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (same pin as validate.yml)
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uvx ruff check demo/target-app
