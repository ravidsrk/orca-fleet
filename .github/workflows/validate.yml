name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # vf-bench review-leg pins need full history, not a depth-1 tip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: Validate missions, playbooks, and evals
        run: python3 scripts/validate.py
      - name: Run the contract test suite
        run: python3 -m unittest discover -s tests
      - name: Check proof-evidence honesty
        run: python3 runtime/scripts/proof_status.py --check
