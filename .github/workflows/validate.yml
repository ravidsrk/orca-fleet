name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # The contract suite, sharded across four parallel jobs (speed-it J1
    # sharding: the ~260 s sequential suite is diffuse process fan-out no
    # hotspot fix removes, so CI fans out instead). scripts/shard-tests.py owns
    # the partition — file-level LPT, unittest stays the runner, stdlib only —
    # and tests/test_shard_tests.py proves the union of the shards equals live
    # discovery. fail-fast false: a red shard must not hide the other three.
    # `gates` below NEEDS this job (branch protection requires the `gates`
    # context, so suite failures block the merge through it).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          fetch-depth: 0  # same full-history checkout the suite ran under in gates
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: Install coverage from the hashed lock
        # Same lock + --require-hashes shape as gates (#301): each matrix job
        # traces its own shard, so each needs the pinned tracer. The whole
        # lock installs (not coverage alone) — one install shape, no second
        # resolution path for a tool to slip through.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-tools.lock
          coverage --version
      - name: Run suite shard without Gitleaks
        run: |
          if command -v gitleaks >/dev/null; then
            echo "::error::the scanner-absent test environment unexpectedly contains Gitleaks"
            exit 1
          fi
          python3 scripts/shard-tests.py --shard ${{ matrix.shard }} --of 4 --with-coverage
      - name: Upload the shard coverage data
        # One .coverage.<host>.<pid>.<random> per shard (--parallel-mode);
        # gates downloads all four and combines before the D9 report. No
        # if:always: a red shard uploads nothing, gates skips on the failed
        # need, and the suite failure itself blocks the merge.
        # include-hidden-files: dotfiles are EXCLUDED by default, and every
        # parallel-mode data file is one — without it the upload finds
        # nothing and fails the shard (PR #480, first CI run).
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24, #367; v4/v5 are Node 20, gone from runners 2026-09-23)
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
  gates:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          fetch-depth: 0  # vf-bench review-leg pins need full history, not a depth-1 tip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: Validate missions, playbooks, and evals
        run: python3 scripts/validate.py
      - name: Routing eval gate (description-based router)
        # #260: this is the gate, not the summary step below. It scores every
        # prompt in evals/routing.json against the REAL frontmatter descriptions
        # and fails the build under the threshold, so a description edit that
        # breaks routing cannot merge. Floor tracked in tests/test_evals.py
        # (ROUTING_MIN_SCORE); an error-level description collision fails here too.
        run: python3 scripts/eval.py run --suite routing --threshold 1.0
      - name: Check proof-evidence honesty
        run: python3 runtime/scripts/proof_status.py --check
      - name: Proof tiers bind to artifacts, not filenames
        # #259: a tier above doctrine-only must re-derive — a RUN: header, a
        # manifest inside the run's own directory, and an integrity inventory
        # re-hashed from git objects at the commit the header names. Needs the
        # full history the checkout step above fetches.
        run: python3 runtime/scripts/run_report.py
      - name: Bundle builds self-contained missions
        # #272 / docs/reviews/2026-09-10-review.md P2-18: a copy installer severs every ../../ reference.
        # --check builds the distribution tree in a temp dir and fails if any link
        # still leaves a mission directory.
        run: python3 scripts/bundle.py --check
      - name: Install the pinned CI tools (hashes, not version strings)
        # #301: these were three version strings with no checksum and no test —
        # "a version string with no hash and no test guarding it is a comment."
        # The step used to argue that hashing them needed a lockfile. That was
        # right; .github/ci-tools.lock IS the lockfile, hashes and all, and
        # --require-hashes makes a swapped artifact fail before it executes.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-tools.lock
          ruff --version
          agentskills --version
      - name: agentskills.io reference validator (skills-ref)
        # #263: the repo's own claims live under `metadata:` so the catalog is
        # installable through Anthropic's own paths, which hard-error on an
        # unexpected top-level key. This is the upstream validator saying so,
        # not our restatement of it.
        run: |
          set -euo pipefail
          for d in skills/*/; do
            agentskills validate "$d"
          done
      - name: Secret scan (gitleaks, pinned)
        # #270: doctrine in dispatch-lifecycle.md until now. Pinned by version
        # AND sha256 — a moved tag or a swapped asset fails the checksum before
        # anything executes. --redact so a finding never prints the secret.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm -f gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          gl="$RUNNER_TEMP/gitleaks/gitleaks"
          # Exercise the verifier's optional-scanner path as well as the built-in floor above.
          PATH="$RUNNER_TEMP/gitleaks:$PATH" python3 -m unittest discover -s tests -p test_verify.py
          # .gitleaksignore, not an allowlist: tests/test_decisions.py carries
          # credential-SHAPED fixtures (it exists to prove decisions.py refuses
          # credentials) and `detect` reads git history, so editing the file
          # cannot clear them. A path allowlist would waive the whole file --
          # measured, not assumed: gitleaks 8.30 ignores `condition = "AND"` and
          # a real key planted in that file went unflagged.
          #
          # It was a --baseline-path baseline until #300, which carried each
          # finding's commit message, author and e-mail beside it. A waiver needs
          # the finding's identity, not its content -- and 8.30.1 compares Email,
          # Author, Date, Message, Entropy, Description and Commit when matching a
          # baseline entry, so deleting those fields stops it suppressing anything.
          # .gitleaksignore takes the fingerprint alone, which is the whole waiver.
          "$gl" detect --redact --no-banner --source .
          # An ignore file IS a waiver, so prove it waives only what it lists.
          # Plant a real-shaped key in the waived file itself, in a throwaway
          # clone, and require the same command to go red. The key is assembled
          # at runtime so this workflow file never contains a detectable literal.
          canary="$RUNNER_TEMP/canary"
          git clone --quiet . "$canary"
          printf 'CANARY = "%s%s"\n' 'AKIA' 'ZYXWVUTSRQPONMLK' >> "$canary/tests/test_decisions.py"
          git -C "$canary" -c user.email=ci@local -c user.name=ci commit -aqm canary
          if (cd "$canary" && "$gl" detect --redact --no-banner --source .); then
            echo "::error::the secret scan passed a planted credential — .gitleaksignore is waiving more than it lists"
            exit 1
          fi
          echo "negative control: a planted credential in the waived file is still caught"
      - name: Ruff (syntax / undefined names)
        # Installed from the hashed lock above (#301), not re-resolved here.
        run: ruff check scripts runtime/scripts tests bench demo
      - name: Download the shard coverage data
        # merge-multiple: all four coverage-shard-* artifacts land in the
        # checkout root, where `coverage combine` below expects them.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24, #367; v4-v6 are Node 20, gone from runners 2026-09-23)
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: "Coverage floor (D9: line >= 80% on scripts + runtime/scripts)"
        # CONSTRAINTS.md D9, wired by the floor-it WIRE phase: the four matrix
        # jobs each traced their own shard (one parallel-mode data file per
        # shard, uploaded beside the job), and this step downloads all four,
        # combines, and reports on the committed .coveragerc (fail_under = 80,
        # ratchet-only). The gate is the same number over the same tests —
        # collection fanned out, the bar did not move. Installed from the
        # hashed lock above (#301), not re-resolved here. gates NEEDS the
        # matrix, so a red suite skips this step and the suite failure — not
        # a missing data file — is what blocks the merge.
        run: |
          set -euo pipefail
          coverage combine
          coverage report
      - name: Publish the gate summary (proof rollup + routing score)
        # Observability only (#213): the numbers land in the run summary even
        # when a gate is red. The routing GATE is the step above; this one
        # swallows its exit code on purpose and can never fail the build.
        if: always()
        run: |
          {
            echo "## Catalog gates @ $(git rev-parse --short HEAD)"
            echo '```'
            python3 runtime/scripts/proof_status.py || echo "proof_status: FAILED"
            python3 scripts/eval.py run --suite routing || echo "routing eval: FAILED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  vfbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          fetch-depth: 0  # a skipped trap is a hole in the score, not a pass (#412)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: VF-Bench soundness gate (verify.py false-done must be 0)
        # #412: 0% false-done is a held property, not a historical fact. Fails on
        # corpus drift off VERSION+CANARY, any skipped trap, verify.py false_done
        # > 0, or any valid-control failure. RED means fix the verifier, never
        # the corpus. ~11s locally; stays in the PR gate by design, no nightly
        # waiver without an issue.
        run: |
          set -euo pipefail
          time python3 bench/vf-bench/gate.py
